name: Generate and publish daily K-pop puzzles

on:
  # 15:00 UTC is noon in Sao Paulo. GitHub has been starting scheduled runs
  # about 5 hours late, so the next day's set still lands before midnight.
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Reference date YYYY-MM-DD (optional, defaults to current date)'
        required: false
        type: string
      regenerate:
        description: 'Generate the date again even if it is already published'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-puzzles
  cancel-in-progress: false

jobs:
  daily-puzzles:
    runs-on: ubuntu-latest
    env:
      REFERENCE_DATE: ${{ inputs.date }}
      REGENERATE: ${{ inputs.regenerate }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Restore database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            data/kpop.db
            data/raw
          key: kpop-db-${{ github.run_id }}
          restore-keys: |
            kpop-db-

      # Wikidata answers maxlag while its query service lags, sometimes for
      # longer than the client's own backoff. Retry the rebuild; if it keeps
      # failing, restore the cached database and publish from it, so the day
      # still gets puzzles built from the previous day's facts.
      - name: Rebuild database from Wikipedia and Wikidata
        timeout-minutes: 120
        run: |
          mkdir -p data
          if [ -f data/kpop.db ]; then cp data/kpop.db data/kpop.db.cached; fi
          for attempt in 1 2 3; do
            if python main.py --facts --releases --database data/kpop.db; then
              rm -f data/kpop.db.cached
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Rebuild attempt $attempt failed; retrying in 10 minutes"
              sleep 600
            fi
          done
          if [ ! -f data/kpop.db.cached ]; then
            echo "::error::Rebuild failed and no cached database is available"
            exit 1
          fi
          # The failed attempts wrote raw snapshots that the restored database
          # does not reference. Delete them so they do not reach the cache.
          # cp gave data/kpop.db.cached the time it ran as its mtime, so only
          # files written after the step started are newer than it.
          if [ -d data/raw ]; then
            find data/raw -type f -newer data/kpop.db.cached -delete
          fi
          mv data/kpop.db.cached data/kpop.db
          echo "::warning title=Database not refreshed::Rebuild failed 3 times; puzzles use the cached database"

      - name: Generate daily puzzles
        run: |
          args=(--database data/kpop.db --output-dir web/public/data --ahead)
          if [ "$REGENERATE" = "true" ]; then args+=(--regenerate); fi
          if [ -n "$REFERENCE_DATE" ]; then
            python3 -c 'import datetime, os; value=os.environ["REFERENCE_DATE"]; assert len(value)==10 and datetime.date.fromisoformat(value).isoformat()==value, "Invalid reference date"'
            args+=(--date "$REFERENCE_DATE")
          fi
          python -m kpop_scraping.daily_puzzles_cli "${args[@]}"

      - name: Verify published artifacts
        working-directory: web
        run: npm run artifacts:verify

      - name: Build static web app
        working-directory: web
        run: npm run build

      - name: Commit and push daily puzzles if changed
        run: |
          if [ -n "$(git status --porcelain web/public/data)" ]; then
            TARGET_DATE="$REFERENCE_DATE"
            if [ -z "$TARGET_DATE" ]; then
              TARGET_DATE=$(python3 -c 'from kpop_scraping.daily_puzzles_runner import get_reference_date; print(get_reference_date())')
            fi
            git config user.name "Pedro Satin"
            git config user.email "pedro.satin@saudebliss.com.br"
            git add web/public/data
            git commit -m "Publish daily puzzles for ${TARGET_DATE}"
            git push origin master
          else
            echo "No changes in web/public/data to publish"
          fi
