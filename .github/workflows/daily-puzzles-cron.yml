name: Generate and publish daily K-pop puzzles

on:
  # 15:00 UTC is noon in Sao Paulo. GitHub has been starting scheduled runs
  # about 5 hours late, so the next day's set still lands before midnight.
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Reference date YYYY-MM-DD (optional, defaults to current date)'
        required: false
        type: string
      regenerate:
        description: 'Generate the date again even if it is already published'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-puzzles
  cancel-in-progress: false

jobs:
  daily-puzzles:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      target_date: ${{ steps.changes.outputs.target_date }}
    env:
      REFERENCE_DATE: ${{ inputs.date }}
      REGENERATE: ${{ inputs.regenerate }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Restore database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/kpop.db
            data/raw
          key: kpop-db-${{ github.run_id }}
          restore-keys: |
            kpop-db-

      # Wikidata answers maxlag while its query service lags, sometimes for
      # longer than the client's own backoff. Retry the rebuild; if it keeps
      # failing, restore the cached database and publish from it, so the day
      # still gets puzzles built from the previous day's facts.
      - name: Rebuild database from Wikipedia and Wikidata
        timeout-minutes: 120
        run: |
          mkdir -p data
          if [ -f data/kpop.db ]; then cp data/kpop.db data/kpop.db.cached; fi
          for attempt in 1 2 3; do
            if python main.py --facts --releases --database data/kpop.db; then
              rm -f data/kpop.db.cached
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Rebuild attempt $attempt failed; retrying in 10 minutes"
              sleep 600
            fi
          done
          if [ ! -f data/kpop.db.cached ]; then
            echo "::error::Rebuild failed and no cached database is available"
            exit 1
          fi
          # The failed attempts wrote raw snapshots that the restored database
          # does not reference. Delete them so they do not reach the cache.
          # cp gave data/kpop.db.cached the time it ran as its mtime, so only
          # files written after the step started are newer than it.
          if [ -d data/raw ]; then
            find data/raw -type f -newer data/kpop.db.cached -delete
          fi
          mv data/kpop.db.cached data/kpop.db
          echo "::warning title=Database not refreshed::Rebuild failed 3 times; puzzles use the cached database"

      - name: Generate daily puzzles
        run: |
          args=(--database data/kpop.db --output-dir web/public/data --ahead)
          if [ "$REGENERATE" = "true" ]; then args+=(--regenerate); fi
          if [ -n "$REFERENCE_DATE" ]; then
            python3 - <<'PY'
          import datetime, os
          value = os.environ["REFERENCE_DATE"]
          try:
              valid = len(value) == 10 and datetime.date.fromisoformat(value).isoformat() == value
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("Invalid reference date: expected a real date as YYYY-MM-DD")
          PY
            args+=(--date "$REFERENCE_DATE")
          fi
          python -m kpop_scraping.daily_puzzles_cli "${args[@]}"

      - name: Verify published artifacts
        working-directory: web
        run: npm run artifacts:verify

      - name: Build static web app
        working-directory: web
        run: npm run build

      - name: Detect changes in published data
        id: changes
        run: |
          if [ -n "$(git status --porcelain web/public/data)" ]; then
            TARGET_DATE="$REFERENCE_DATE"
            if [ -z "$TARGET_DATE" ]; then
              TARGET_DATE=$(python3 -c 'from kpop_scraping.daily_puzzles_runner import get_reference_date; print(get_reference_date())')
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in web/public/data to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated data
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-puzzles-data
          path: web/public/data
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  commit:
    needs: daily-puzzles
    if: needs.daily-puzzles.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_DATE: ${{ needs.daily-puzzles.outputs.target_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download generated data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daily-puzzles-data
          path: ${{ runner.temp }}/daily-puzzles-data

      - name: Apply generated data
        run: |
          rm -rf web/public/data
          mkdir -p web/public
          cp -a "$RUNNER_TEMP/daily-puzzles-data" web/public/data

      - name: Commit and push daily puzzles
        run: |
          git config user.name "Pedro Satin"
          git config user.email "33128737+pedrosatin@users.noreply.github.com"
          git add web/public/data
          git commit -m "Publish daily puzzles for ${TARGET_DATE}"
          git push origin master
