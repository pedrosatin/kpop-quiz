name: Generate and publish daily K-pop puzzles

on:
  # 15:00 UTC is noon in Sao Paulo. GitHub has been starting scheduled runs
  # about 5 hours late, so the next day's set still lands before midnight.
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Reference date YYYY-MM-DD (optional, defaults to current date)'
        required: false
        type: string
      regenerate:
        description: 'Generate the date again even if it is already published'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-puzzles
  cancel-in-progress: false

jobs:
  daily-puzzles:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      target_date: ${{ steps.changes.outputs.target_date }}
      source_data_tree: ${{ steps.changes.outputs.source_data_tree }}
    env:
      REFERENCE_DATE: ${{ inputs.date }}
      REGENERATE: ${{ inputs.regenerate }}
      # Related decade clues cite a fact outside the question's own, which a
      # client released before they existed rejects. With the repository
      # variable QUIZ_RELATED_CLUES set to "true" the run also publishes
      # manifest-v3.json with those clues. manifest-v2.json keeps listing only
      # sessions every released client accepts, so the variable is safe to
      # turn on or off at any time: older clients never read the v3 manifest.
      RELATED_CLUES: ${{ vars.QUIZ_RELATED_CLUES }}
      # With the repository variable QUIZ_CATALOG set to "true" the run also
      # publishes the static question catalog (catalog-manifest-v1.json and its
      # shards). No released client reads it yet, so turning it on only adds
      # files; turning it off again withdraws them. It is about 10 MB per
      # shard before compression, so leave it off until the replay that reads it ships.
      CATALOG: ${{ vars.QUIZ_CATALOG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Restore database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/kpop.db
            data/raw
          key: kpop-db-${{ github.run_id }}
          restore-keys: |
            kpop-db-

      # Wikidata answers maxlag while its query service lags, sometimes for
      # longer than the client's own backoff. scripts/rebuild_database.py runs
      # the collector at most 3 times, 30 minutes each and 10 minutes apart,
      # and repeats only an attempt that ended in a transient error (exit 75).
      # At worst that takes 111.5 minutes, inside this step's timeout.
      # continue-on-error keeps the job going when the step fails or times
      # out, so the next step can restore the cached database and the day
      # still gets puzzles built from the previous day's facts (ADR 032).
      # On timeout or cancel the runner signals only the shell's PID; exec
      # makes that PID the script's, which then kills the running attempt.
      - name: Rebuild database from Wikipedia and Wikidata
        id: rebuild
        continue-on-error: true
        timeout-minutes: 120
        run: |
          exec python3 scripts/rebuild_database.py rebuild --database data/kpop.db -- \
            python main.py --facts --releases --database data/kpop.db

      # outcome is the result of the step before continue-on-error applies:
      # "failure" for a non-zero exit and for the step timeout. failure()
      # would never fire here, because continue-on-error keeps the job
      # successful, which the steps below and the deploy both need.
      - name: Restore cached database
        if: steps.rebuild.outcome == 'failure'
        timeout-minutes: 5
        env:
          REBUILD_FAILURE: ${{ steps.rebuild.outputs.failure }}
        run: python3 scripts/rebuild_database.py restore-cache --database data/kpop.db

      # A normal run takes under a minute. The timeout keeps a stuck
      # generator from holding the concurrency group, which queues the
      # following runs (cancel-in-progress is false). A game that fails is
      # left out of its day and the step still succeeds; it fails only when
      # no game of the day could be generated (daily_puzzles_runner).
      - name: Generate daily puzzles
        timeout-minutes: 20
        run: |
          args=(--database data/kpop.db --output-dir web/public/data --ahead
            --board-swaps-file "$RUNNER_TEMP/board-swaps.json")
          if [ "$REGENERATE" = "true" ]; then args+=(--regenerate); fi
          if [ "$RELATED_CLUES" = "true" ]; then args+=(--related-clues); fi
          if [ "$CATALOG" = "true" ]; then args+=(--catalog); fi
          if [ -n "$REFERENCE_DATE" ]; then
            python3 - <<'PY'
          import datetime, os
          value = os.environ["REFERENCE_DATE"]
          try:
              valid = len(value) == 10 and datetime.date.fromisoformat(value).isoformat() == value
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("Invalid reference date: expected a real date as YYYY-MM-DD")
          PY
            args+=(--date "$REFERENCE_DATE")
          fi
          python -m kpop_scraping.daily_puzzles_cli "${args[@]}"

      - name: Verify published artifacts
        working-directory: web
        run: npm run artifacts:verify

      # A date already published keeps its boards unless the run asked to
      # --regenerate or the runner declared the swap (see board_swap_gate).
      - name: Refuse undeclared board swaps
        run: python -m kpop_scraping.board_swap_gate --board-swaps-file "$RUNNER_TEMP/board-swaps.json"

      - name: Build static web app
        working-directory: web
        run: npm run build

      - name: Detect changes in published data
        id: changes
        run: |
          if [ -n "$(git status --porcelain web/public/data)" ]; then
            TARGET_DATE="$REFERENCE_DATE"
            if [ -z "$TARGET_DATE" ]; then
              TARGET_DATE=$(python3 -c 'from kpop_scraping.daily_puzzles_runner import get_reference_date; print(get_reference_date())')
            fi
            echo "source_data_tree=$(git rev-parse HEAD:web/public/data)" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in web/public/data to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated data
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-puzzles-data
          path: web/public/data
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: daily-puzzles
    if: needs.daily-puzzles.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET_DATE: ${{ needs.daily-puzzles.outputs.target_date }}
      SOURCE_DATA_TREE: ${{ needs.daily-puzzles.outputs.source_data_tree }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The live default branch, not github.sha: the generating job can
          # run for a long time and master may advance in the meantime.
          ref: master

      - name: Download generated data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daily-puzzles-data
          path: ${{ runner.temp }}/daily-puzzles-data

      - name: Apply generated data
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD:web/public/data)" != "$SOURCE_DATA_TREE" ]; then
            echo "::error::Published data changed during generation. Rerun the full workflow to generate from the new data."
            exit 1
          fi
          rm -rf web/public/data
          mkdir -p web/public
          cp -a "$RUNNER_TEMP/daily-puzzles-data" web/public/data

      # Branch protection on master requires changes to arrive via pull
      # request. Publish the generated data on an automation branch, then
      # merge its pull request, so the deploy triggered by this workflow's
      # completion still sees the new data. The script only merges a pull
      # request of this repository whose head is the commit pushed here, and
      # opens one when there is none: a fork's pull request under the same
      # branch name is never merged (ADR 031).
      - name: Publish via pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/daily-puzzles
        run: |
          set -euo pipefail
          git config user.name "Pedro Satin"
          git config user.email "33128737+pedrosatin@users.noreply.github.com"
          git add web/public/data
          git commit -m "Publish daily puzzles for ${TARGET_DATE}"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          head_sha="$(git rev-parse HEAD)"
          python3 scripts/publish_via_pr.py \
            --repo "${GITHUB_REPOSITORY}" \
            --branch "${BRANCH}" \
            --head-sha "${head_sha}" \
            --title "Publish daily puzzles for ${TARGET_DATE}" \
            --body "Automated publication of the daily puzzle set."
