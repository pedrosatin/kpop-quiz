name: CI

on:
  pull_request:
    branches:
      - master
      - main
      - dev
    # Generated-data-only PRs come from the publish jobs, which create and
    # merge their pull request within seconds. Pending pull_request runs then
    # die with the merge ref and show up as empty failures, so skip them.
    paths-ignore:
      - "web/public/data/**"
      - "data/map-pilot/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Python & Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run Python verification
        run: |
          python -m compileall -q .
          python -m unittest discover -v

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Run Web tests
        working-directory: web
        run: npm test

      - name: Run Web build
        working-directory: web
        run: npm run build
