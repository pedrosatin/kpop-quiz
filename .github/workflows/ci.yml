name: CI

on:
  pull_request:
    branches:
      - master
      - main
      - dev
    # Generated-data-only PRs come from the publish jobs, which create and
    # merge their pull request within seconds. Pending pull_request runs then
    # die with the merge ref and show up as empty failures, so skip them.
    paths-ignore:
      - "web/public/data/**"
      - "data/map-pilot/**"
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Python & Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Python verification
        run: |
          python -m compileall -q .
          python -m unittest discover -v

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Run Web tests
        working-directory: web
        run: npm test

      - name: Run Web build
        working-directory: web
        run: npm run build

  code-feedback:
    name: Code feedback (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: banner
            base: ""
            ga4: G-CODEFEEDBACKTEST
            beacon: ""
          - environment: root
            base: ""
            ga4: ""
            beacon: ""
          - environment: staging
            base: /kpop-quiz
            ga4: G-STAGINGGUARD
            beacon: staging-guard-dummy-token
    defaults:
      run:
        working-directory: web
    env:
      ASTRO_SITE: https://example.test
      ASTRO_BASE: ${{ matrix.base }}
      PUBLIC_GA4_ID: ${{ matrix.ga4 }}
      PUBLIC_CF_BEACON_TOKEN: ${{ matrix.beacon }}
      CODE_FEEDBACK_ENV: ${{ matrix.environment }}
      CODE_FEEDBACK_CF_BEACON: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Verify feedback and the explicit consent contract
        env:
          BASE_URL: http://127.0.0.1:4321${{ matrix.base }}/
        run: npx playwright test e2e/code-visible-feedback.spec.ts --project=chromium --retries=0 --workers=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: code-feedback-${{ matrix.environment }}
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
