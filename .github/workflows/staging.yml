name: Build and deploy staging to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run Python verification
        working-directory: .
        run: |
          python -m unittest discover -v
          python -m compileall -q .
      - name: Verify published quiz artifacts
        working-directory: .
        # A daily set may publish without grid.daily.json when the fill fails; a present grid is still validated.
        run: python -m kpop_scraping.web_publish --output-dir web/public/data --verify --require-connections --require-name-guess --require-word-search --require-timeline
      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npm test
      - name: Build for the repository subdirectory
        env:
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
          # Dummy IDs so the analytics guard below exercises the
          # isStaging gate instead of passing vacuously (ADR 017).
          PUBLIC_CF_BEACON_TOKEN: staging-guard-dummy-token
          PUBLIC_GA4_ID: G-STAGINGGUARD
        run: npm run build
      - name: Guard against analytics in staging
        run: |
          # HTML is the executable surface: no page may reference a
          # measurement host. (An unreferenced banner chunk may exist in
          # dist/_astro; it cannot execute without a <script> tag, see ADR 017.)
          if grep -RqE "cloudflareinsights.com|googletagmanager.com|google-analytics.com" --include='*.html' dist/; then
            echo "::error::Analytics snippet leaked into the staging build."
            exit 1
          fi
          missing=$(grep -RL 'name="robots" content="noindex"' --include='*.html' dist/ || true)
          if [ -n "$missing" ]; then
            echo "::error::Staging HTML missing noindex: $missing"
            exit 1
          fi
      - name: Verify SEO guards on the staging build
        run: npm run seo:verify -- --env staging
      # Full Chromium suite (boot smoke + playthrough) against dist/ already built above.
      # Do not use npm run test:e2e; pretest rebuilds. Prefer test:e2e:ci (no pretest).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright boot and playthrough against local dist
        env:
          CI: true
        run: npm run test:e2e:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Post-deploy full Chromium suite (boot smoke + playthrough) against the GitHub Pages
  # staging URL (subdirectory base). Separate job so we can check out sources for Playwright;
  # deploy has no node checkout.
  smoke-staging:
    if: github.ref == 'refs/heads/dev'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright boot and playthrough against staging
        env:
          CI: true
          STAGING_BASE_URL: ${{ needs.deploy.outputs.page_url || 'https://pedrosatin.github.io/kpop-quiz/' }}
        run: npm run test:e2e:staging
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-staging
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
