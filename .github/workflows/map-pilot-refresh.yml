name: Refresh map pilot tour dates

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-pilot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Wikidata answers maxlag while its query service lags, which can last
      # longer than the client's own backoff. Retry the whole rebuild later.
      - name: Rebuild tour dates from the YG schedule, MusicBrainz and Wikidata
        timeout-minutes: 90
        run: |
          for attempt in 1 2 3 4; do
            python -m kpop_scraping.map_pilot_refresh && exit 0
            if [ "$attempt" -lt 4 ]; then
              echo "Attempt $attempt failed; retrying in 15 minutes"
              sleep 900
            fi
          done
          exit 1

      - name: Validate the refreshed dataset
        run: python -m unittest tests.test_map_pilot_refresh -v

      - name: Run map pilot web tests
        working-directory: web
        run: |
          npm ci
          npx vitest run src/data/map-pilot.test.ts src/components/MapPilot

      - name: Detect changes in the refreshed dataset
        id: changes
        run: |
          if [ -z "$(git status --porcelain data/map-pilot)" ]; then
            echo "No changes in data/map-pilot"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload refreshed dataset
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-pilot-data
          path: data/map-pilot
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  commit:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download refreshed dataset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: map-pilot-data
          path: ${{ runner.temp }}/map-pilot-data

      - name: Apply refreshed dataset
        run: |
          rm -rf data/map-pilot
          mkdir -p data
          cp -a "$RUNNER_TEMP/map-pilot-data" data/map-pilot

      - name: Commit and push refreshed dates
        run: |
          git config user.name "Pedro Satin"
          git config user.email "33128737+pedrosatin@users.noreply.github.com"
          git add data/map-pilot
          git commit -m "Refresh map pilot tour dates for $(date -u +%F)"
          git pull --rebase origin master
          git push origin master
