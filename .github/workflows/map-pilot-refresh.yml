name: Refresh map pilot tour dates

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-pilot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Wikidata answers maxlag while its query service lags, which can last
      # longer than the client's own backoff. Retry the whole rebuild later.
      - name: Rebuild tour dates from the YG schedule, MusicBrainz and Wikidata
        timeout-minutes: 90
        run: |
          for attempt in 1 2 3 4; do
            python -m kpop_scraping.map_pilot_refresh && exit 0
            if [ "$attempt" -lt 4 ]; then
              echo "Attempt $attempt failed; retrying in 15 minutes"
              sleep 900
            fi
          done
          exit 1

      - name: Validate the refreshed dataset
        run: python -m unittest tests.test_map_pilot_refresh -v

      - name: Run map pilot web tests
        working-directory: web
        run: |
          npm ci
          npx vitest run src/data/map-pilot.test.ts src/components/MapPilot

      - name: Detect changes in the refreshed dataset
        id: changes
        run: |
          if [ -z "$(git status --porcelain data/map-pilot)" ]; then
            echo "No changes in data/map-pilot"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload refreshed dataset
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-pilot-data
          path: data/map-pilot
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The live default branch, not github.sha: the generating job can
          # run for a long time and master may advance in the meantime.
          ref: master

      - name: Download refreshed dataset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: map-pilot-data
          path: ${{ runner.temp }}/map-pilot-data

      - name: Apply refreshed dataset
        run: |
          rm -rf data/map-pilot
          mkdir -p data
          cp -a "$RUNNER_TEMP/map-pilot-data" data/map-pilot

      # validate_map_pilot_dataset, the check "Validate the refreshed dataset"
      # runs through tests.test_map_pilot_refresh, run again from master's
      # code on the files the commit below would hold. A dataset that fails
      # here stops the job before git add (ADR 040).
      - name: Verify downloaded dataset
        run: python3 -m kpop_scraping.map_pilot_refresh --verify --output data/map-pilot/deadline-events.json

      # Branch protection on master requires changes to arrive via pull
      # request. Publish the refreshed dataset on an automation branch, then
      # merge its pull request, so the deploy triggered by this workflow's
      # completion still sees the new data. The script only merges a pull
      # request of this repository whose head is the commit pushed here, and
      # opens one when there is none: a fork's pull request under the same
      # branch name is never merged (ADR 031).
      - name: Publish via pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/map-pilot-refresh
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          git config user.name "Pedro Satin"
          git config user.email "33128737+pedrosatin@users.noreply.github.com"
          git add data/map-pilot
          git commit -m "Refresh map pilot tour dates for ${DATE}"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          head_sha="$(git rev-parse HEAD)"
          python3 scripts/publish_via_pr.py \
            --repo "${GITHUB_REPOSITORY}" \
            --branch "${BRANCH}" \
            --head-sha "${head_sha}" \
            --title "Refresh map pilot tour dates for ${DATE}" \
            --body "Automated refresh of the map pilot tour dataset."
