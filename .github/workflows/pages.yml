name: Build and deploy web app to Cloudflare Pages

on:
  pull_request:
    # Runs for any change except generated data. The publish jobs create and
    # merge their pull request within seconds; pending pull_request runs then
    # die with the merge ref and show up as empty failures. Those automation
    # pull requests only touch generated data, so skip them here. (Note:
    # `paths` and `paths-ignore` cannot be combined on the same event.)
    paths-ignore:
      - "web/public/data/**"
      - "data/map-pilot/**"
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  push:
    branches: [master]
    paths:
      - "web/**"
      - "data/map-pilot/**"
      - "kpop_scraping/**"
      - "tests/**"
      - "schemas/**"
      - "requirements.txt"
      - "requirements-ci.txt"
      - ".github/workflows/pages.yml"
      - ".github/workflows/changes.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate and publish daily K-pop puzzles", "Refresh map pilot tour dates"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The checks run as parallel jobs, so a run takes as long as the slowest
  # one. deploy needs all of them and publishes the dist/ of the build job.

  # Decides whether vitest, build and e2e run: `web` is false only in a pull
  # request that leaves the site alone. The detection and its fail-open rule
  # (any result but success runs the jobs below) are in changes.yml. The
  # `python` output is for ci.yml; the Python job here runs outside pull
  # requests, where everything runs.
  #
  # `paths` on the trigger is not used to skip these jobs: the artifact
  # check below has to keep running in the pull requests that skip them.
  changes:
    uses: ./.github/workflows/changes.yml

  # The published artifacts are data, not site code, so this check runs in
  # every pull request, including the ones that skip the web jobs. It was a
  # step of the build job.
  artifacts:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify published quiz artifacts
        # Checks data/ and data/next/. A day the runner published without a grid passes only when its grid-publication record has grid_id null.
        run: python -m kpop_scraping.web_publish --output-dir web/public/data --verify --require-grid --require-connections --require-name-guess --require-word-search --require-timeline

  python:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # This workflow builds the published site, so the runner comes pinned
      # by hash and as wheels only: nothing runs at install time.
      - name: Install Python test runner
        run: python -m pip install --require-hashes --only-binary ':all:' -r requirements-ci.txt
      # One worker per vCPU, single tests handed out, slowest tests listed.
      - name: Run Python verification
        run: |
          python -m pytest tests -n logical --dist load --durations=20 -rfEs -p no:cacheprovider
          python -m compileall -q .

  # The only `npm test` of a pull request: ci.yml runs it outside pull
  # requests only. Here it waits for the same detection as the build, so a
  # pull request that leaves the site alone skips it, and a failed detection
  # runs it.
  vitest:
    needs: changes
    # !cancelled() keeps the job running when `changes` failed, which would
    # otherwise skip it: a failed detection means "run", never "skip".
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No install script runs, as in the build job (ADR 040).
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    needs: changes
    # !cancelled() keeps the job running when `changes` failed, which would
    # otherwise skip it: a failed detection means "run", never "skip".
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No install script runs: the build and the tests need none, and
      # esbuild and workerd take their binaries from the platform packages
      # in the lockfile (ADR 040).
      - run: npm ci --ignore-scripts
      # The analytics IDs end up in every built page, so they are repository
      # variables. The secret of the same name is the fallback until the
      # variable exists; then the secret can go (ADR 040).
      - name: Build production site
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN || secrets.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID || secrets.PUBLIC_GA4_ID }}
          PUBLIC_TBBC_SITE_KEY: ${{ vars.PUBLIC_TBBC_SITE_KEY }}
        run: npm run build
      - run: npm run seo:verify -- --env prod
      - run: npm run csp:verify
      # deploy publishes this dist/ as it is, so the artifact exists only
      # when deploy runs. upload-artifact skips dotfiles by default; with
      # include-hidden-files the artifact holds the whole dist/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Full Chromium suite (boot smoke + playthrough), split into shards that run
  # in parallel. Each shard builds the site with the same command and
  # variables as the build job and runs its part of the suite against it. On
  # 2026-11-17 a local build of the deployed commit had the same files as the
  # deployed dist/; only the astro-island uid attributes differed. Building in
  # each shard, instead of downloading the build job's dist/, keeps that job
  # off the E2E critical path.
  #
  # scripts/e2e-shards.mjs picks each shard's tests by the durations the last
  # master run recorded, and falls back to Playwright's --shard when there are
  # none or the lists do not add up to the suite. e2e-report merges the shard
  # reports and checks that the suite ran once; e2e-verdict is the E2E result.
  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    # !cancelled() keeps the job running when `changes` failed, which would
    # otherwise skip it: a failed detection means "run", never "skip".
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)))
    # To download the durations artifact of an earlier run.
    permissions:
      actions: read
      contents: read
    strategy:
      # A failed shard leaves the others running, so the merged report still
      # covers the whole suite.
      fail-fast: false
      matrix:
        # The shard count is the length of this list. On the durations of
        # 2026-11-18 two shards already put the pull request under 6 minutes;
        # each shard is one more job in the account's limit of concurrent jobs.
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build production site
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN || secrets.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID || secrets.PUBLIC_GA4_ID }}
          PUBLIC_TBBC_SITE_KEY: ${{ vars.PUBLIC_TBBC_SITE_KEY }}
        run: npm run build
      # The headless tests launch chromium-headless-shell only. The cache key
      # is its own: ci.yml and smoke-prod cache the full Chromium under the
      # shared Chromium key, and the first job to save a key decides what it
      # holds.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
      # The newest master durations artifact created before this run, so
      # every shard, and a shard re-run later, reads the same one. With none,
      # the plan falls back to --shard. An API error fails the job instead:
      # the other shards may have split by the artifact.
      - name: Fetch recorded test durations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/e2e-durations"
          mkdir -p "$dir"

          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
          }
          run_created() {
            created=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq .created_at)
          }
          # Only artifacts of master runs of this repository: a fork's pull
          # request can upload an artifact of the same name from a branch
          # named master.
          newest_artifact() {
            id=$(gh api "repos/$REPOSITORY/actions/artifacts?name=e2e-durations&per_page=100" --jq "
              [.artifacts[] | select(.expired == false
                and .workflow_run.head_branch == \"master\"
                and .workflow_run.head_repository_id == .workflow_run.repository_id
                and .created_at < \"$created\")]
              | sort_by(.created_at) | last | .id // empty")
          }
          download() {
            gh api "repos/$REPOSITORY/actions/artifacts/$id/zip" > "$dir/durations.zip"
          }

          retry run_created
          retry newest_artifact
          if [ -z "$id" ]; then
            echo "No recorded durations before $created; the shards split with --shard."
            exit 0
          fi
          retry download
          unzip -o -q "$dir/durations.zip" -d "$dir"
          echo "Recorded durations: artifact $id"
      # The listing that the plan splits runs with the variables of the run
      # below: CODE_FEEDBACK_ENV decides which tests exist.
      - name: Plan this shard
        id: plan
        env:
          CI: true
          CODE_FEEDBACK_ENV: ${{ (vars.PUBLIC_GA4_ID || secrets.PUBLIC_GA4_ID) != '' && 'banner' || 'root' }}
          CODE_FEEDBACK_CF_BEACON: ${{ (vars.PUBLIC_CF_BEACON_TOKEN || secrets.PUBLIC_CF_BEACON_TOKEN) != '' }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          selection=$(node scripts/e2e-shards.mjs plan --shard "$SHARD" --total "$TOTAL" \
            --durations "$RUNNER_TEMP/e2e-durations/e2e-durations.json" --out "$RUNNER_TEMP/e2e-shards")
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
      # Do not use npm run test:e2e; pretest rebuilds. Prefer test:e2e:ci (no pretest).
      - name: Run Playwright boot and playthrough against local dist
        env:
          CI: true
          CODE_FEEDBACK_ENV: ${{ (vars.PUBLIC_GA4_ID || secrets.PUBLIC_GA4_ID) != '' && 'banner' || 'root' }}
          CODE_FEEDBACK_CF_BEACON: ${{ (vars.PUBLIC_CF_BEACON_TOKEN || secrets.PUBLIC_CF_BEACON_TOKEN) != '' }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
          SELECTION: ${{ steps.plan.outputs.selection }}
        run: |
          # Without a selection, every shard would run the whole suite.
          case "$SELECTION" in
            --test-list=* | --shard=*) ;;
            *) echo "::error::The plan selected no tests for this shard."; exit 1 ;;
          esac
          npm run test:e2e:ci -- --reporter=list,blob "$SELECTION"
      # This shard's part of the report, with the traces and screenshots of
      # the failed tests. e2e-report merges the parts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: web/blob-report/
          retention-days: 1
          if-no-files-found: ignore

  # Merges the shard reports into one HTML and JSON report and checks that the
  # shards ran every test of the suite exactly once. On master it then
  # records the per-test durations that the next runs split by.
  e2e-report:
    needs: [changes, e2e]
    # !cancelled() also merges the reports of failed shards.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: web/blob-reports
      - name: Merge the shard reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-report.json
        run: npx playwright merge-reports --reporter=html,json blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/e2e-report.json
          retention-days: 7
          if-no-files-found: ignore
      # The listing runs with the variables of the shards, which decide which
      # tests exist.
      - name: Check that the shards ran the whole suite
        env:
          CI: true
          CODE_FEEDBACK_ENV: ${{ (vars.PUBLIC_GA4_ID || secrets.PUBLIC_GA4_ID) != '' && 'banner' || 'root' }}
          CODE_FEEDBACK_CF_BEACON: ${{ (vars.PUBLIC_CF_BEACON_TOKEN || secrets.PUBLIC_CF_BEACON_TOKEN) != '' }}
        run: |
          npx playwright test --list --project=chromium --reporter=json > "$RUNNER_TEMP/e2e-list.json"
          node scripts/e2e-shards.mjs check --list "$RUNNER_TEMP/e2e-list.json" --report e2e-report.json
      # Only a master run whose shards all passed records durations, and the
      # shards read only master's (see "Fetch recorded test durations").
      - name: Record test durations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.e2e.result == 'success'
        run: node scripts/e2e-shards.mjs durations --report e2e-report.json --out "$RUNNER_TEMP/e2e-durations/e2e-durations.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.e2e.result == 'success'
        with:
          name: e2e-durations
          path: ${{ runner.temp }}/e2e-durations/e2e-durations.json
          retention-days: 30
          if-no-files-found: error

  # The E2E result, and what deploy waits for: green only when every shard
  # passed and the merged report holds the whole suite once. When `changes`
  # finds no web change it is skipped with the shards, and a skipped job
  # counts as passed for a required check. When the shards should run, a
  # shard or a report that failed, was cancelled or never ran turns it red.
  e2e-verdict:
    needs: [changes, e2e, e2e-report]
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the shards and the merged report
        env:
          SHARDS: ${{ needs.e2e.result }}
          REPORT: ${{ needs.e2e-report.result }}
        run: |
          echo "Shards: $SHARDS. Merged report: $REPORT."
          if [ "$SHARDS" != success ] || [ "$REPORT" != success ]; then
            echo "::error::The E2E suite did not pass in full (shards: $SHARDS, merged report: $REPORT)."
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # e2e-verdict is the E2E result; e2e as well, so no change to the verdict
    # alone can let a red shard through.
    needs: [artifacts, python, vitest, build, e2e, e2e-verdict]
    outputs:
      deployed: ${{ steps.record.outputs.deployed }}
    steps:
      # Only for web/package.json and web/package-lock.json, which pin
      # wrangler. The site itself comes from the build job's artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Check Cloudflare credentials
        id: credentials
        env:
          HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CLOUDFLARE_CREDENTIALS" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. Skipping deploy to Cloudflare Pages. Add both repository secrets to enable deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # No npm cache in the job that holds the Cloudflare token: npm ci
      # fetches the locked tarballs and checks each against its integrity.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.credentials.outputs.skip != 'true'
        with:
          node-version: 24
      # wrangler is a devDependency of web/ at an exact version, so this job
      # runs the version and the transitive dependencies the lockfile names,
      # and Dependabot updates them like any other dependency. No install
      # script runs: esbuild and workerd take their binaries from the
      # platform packages in the lockfile without their install.js (ADR 040).
      - name: Install wrangler from the lockfile
        if: steps.credentials.outputs.skip != 'true'
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      # wrangler runs straight from node_modules. wrangler-action installs
      # wrangler@<version> at deploy time whenever it does not find that
      # version installed; --no-install fails the step instead.
      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.skip != 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy dist --project-name=kpopquiz --branch=master
      # deployed=true only after wrangler succeeds (or false when secrets were missing).
      - name: Record deploy result
        id: record
        env:
          SKIP: ${{ steps.credentials.outputs.skip }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi
      # IndexNow (Bing, Yandex and others) after a production deploy. The key is
      # public by design: web/public/<key>.txt proves ownership of the host.
      # Daily data deploys (workflow_run) leave the route HTML unchanged, so
      # only code deploys ping. A failed ping never fails the deploy (ADR 022).
      - name: Notify IndexNow of the sitemap URLs
        if: steps.credentials.outputs.skip != 'true' && github.event_name != 'workflow_run'
        continue-on-error: true
        run: |
          key_file=$(find web/dist -maxdepth 1 -regextype posix-extended -regex '.*/[0-9a-f]{32}\.txt' -printf '%f\n' | head -n 1)
          if [ -z "$key_file" ]; then
            echo "::warning::IndexNow key file missing from web/dist; skipping the ping."
            exit 0
          fi
          key="${key_file%.txt}"
          urls=$(grep -o '<loc>[^<]*</loc>' web/dist/sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##')
          payload=$(jq -n --arg key "$key" --arg urls "$urls" '{
            host: "kpopquiz.online",
            key: $key,
            keyLocation: "https://kpopquiz.online/\($key).txt",
            urlList: ($urls | split("\n") | map(select(length > 0)))
          }')
          status=$(curl -sS -o indexnow-response.txt -w '%{http_code}' --max-time 30 \
            -H 'Content-Type: application/json; charset=utf-8' \
            -X POST https://api.indexnow.org/indexnow --data "$payload" || true)
          echo "IndexNow answered HTTP ${status:-000} for $(printf '%s\n' "$urls" | grep -c .) URLs"
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            # The body comes from the remote server. jq -R prints it as one
            # JSON string, so none of its lines can start a workflow command.
            jq -Rs . indexnow-response.txt 2>/dev/null || true
            echo "::warning::IndexNow ping returned HTTP ${status:-000}."
          fi

  # Post-deploy Chromium suite (boot smoke + playthrough) against kpopquiz.online, without
  # the @local-build tests, which test a fixture build instead of the live site.
  # Fails the workflow on red; no automatic rollback. Skipped when Cloudflare deploy was skipped (no secrets).
  smoke-prod:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.deploy.outputs.deployed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deploy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright boot and playthrough against production
        env:
          CI: true
          CODE_FEEDBACK_ENV: ${{ (vars.PUBLIC_GA4_ID || secrets.PUBLIC_GA4_ID) != '' && 'banner' || 'root' }}
          CODE_FEEDBACK_CF_BEACON: ${{ (vars.PUBLIC_CF_BEACON_TOKEN || secrets.PUBLIC_CF_BEACON_TOKEN) != '' }}
        run: npm run test:e2e:prod
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-prod
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
