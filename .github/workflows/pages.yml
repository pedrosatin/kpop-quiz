name: Build and deploy web app to Cloudflare Pages

on:
  pull_request:
    # Runs for any change except generated data. The publish jobs create and
    # merge their pull request within seconds; pending pull_request runs then
    # die with the merge ref and show up as empty failures. Those automation
    # pull requests only touch generated data, so skip them here. (Note:
    # `paths` and `paths-ignore` cannot be combined on the same event.)
    paths-ignore:
      - "web/public/data/**"
      - "data/map-pilot/**"
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  push:
    branches: [master]
    paths:
      - "web/**"
      - "data/map-pilot/**"
      - "kpop_scraping/**"
      - "tests/**"
      - "schemas/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate and publish daily K-pop puzzles", "Refresh map pilot tour dates"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run Python verification
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          python -m unittest discover -v
          python -m compileall -q .
      - name: Verify published quiz artifacts
        working-directory: .
        # Checks data/ and data/next/. A day the runner published without a grid passes only when its grid-publication record has grid_id null.
        run: python -m kpop_scraping.web_publish --output-dir web/public/data --verify --require-grid --require-connections --require-name-guess --require-word-search --require-timeline
      - run: npm ci
      - run: npm test
      # The analytics IDs end up in every built page, so they are repository
      # variables. The secret of the same name is the fallback until the
      # variable exists; then the secret can go (ADR 040).
      - name: Build production site
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN || secrets.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID || secrets.PUBLIC_GA4_ID }}
          PUBLIC_TBBC_SITE_KEY: ${{ vars.PUBLIC_TBBC_SITE_KEY }}
        run: npm run build
      - run: npm run seo:verify -- --env prod
      - run: npm run csp:verify
      # Full Chromium suite (boot smoke + playthrough) against dist/ already built above.
      # Do not use npm run test:e2e; pretest rebuilds. Prefer test:e2e:ci (no pretest).
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright boot and playthrough against local dist
        env:
          CI: true
          CODE_FEEDBACK_ENV: ${{ (vars.PUBLIC_GA4_ID || secrets.PUBLIC_GA4_ID) != '' && 'banner' || 'root' }}
          CODE_FEEDBACK_CF_BEACON: ${{ (vars.PUBLIC_CF_BEACON_TOKEN || secrets.PUBLIC_CF_BEACON_TOKEN) != '' }}
        run: npm run test:e2e:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    outputs:
      deployed: ${{ steps.record.outputs.deployed }}
    steps:
      # Only for web/package.json and web/package-lock.json, which pin
      # wrangler. The site itself comes from the build job's artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Check Cloudflare credentials
        id: credentials
        env:
          HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CLOUDFLARE_CREDENTIALS" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. Skipping deploy to Cloudflare Pages. Add both repository secrets to enable deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # No npm cache in the job that holds the Cloudflare token: npm ci
      # fetches the locked tarballs and checks each against its integrity.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.credentials.outputs.skip != 'true'
        with:
          node-version: 24
      # wrangler is a devDependency of web/ at an exact version, so this job
      # runs the version and the transitive dependencies the lockfile names,
      # and Dependabot updates them like any other dependency. No install
      # script runs: esbuild and workerd take their binaries from the
      # platform packages in the lockfile without their install.js (ADR 040).
      - name: Install wrangler from the lockfile
        if: steps.credentials.outputs.skip != 'true'
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      # wrangler runs straight from node_modules. wrangler-action installs
      # wrangler@<version> at deploy time whenever it does not find that
      # version installed; --no-install fails the step instead.
      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.skip != 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy dist --project-name=kpopquiz --branch=master
      # deployed=true only after wrangler succeeds (or false when secrets were missing).
      - name: Record deploy result
        id: record
        env:
          SKIP: ${{ steps.credentials.outputs.skip }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi
      # IndexNow (Bing, Yandex and others) after a production deploy. The key is
      # public by design: web/public/<key>.txt proves ownership of the host.
      # Daily data deploys (workflow_run) leave the route HTML unchanged, so
      # only code deploys ping. A failed ping never fails the deploy (ADR 022).
      - name: Notify IndexNow of the sitemap URLs
        if: steps.credentials.outputs.skip != 'true' && github.event_name != 'workflow_run'
        continue-on-error: true
        run: |
          key_file=$(find web/dist -maxdepth 1 -regextype posix-extended -regex '.*/[0-9a-f]{32}\.txt' -printf '%f\n' | head -n 1)
          if [ -z "$key_file" ]; then
            echo "::warning::IndexNow key file missing from web/dist; skipping the ping."
            exit 0
          fi
          key="${key_file%.txt}"
          urls=$(grep -o '<loc>[^<]*</loc>' web/dist/sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##')
          payload=$(jq -n --arg key "$key" --arg urls "$urls" '{
            host: "kpopquiz.online",
            key: $key,
            keyLocation: "https://kpopquiz.online/\($key).txt",
            urlList: ($urls | split("\n") | map(select(length > 0)))
          }')
          status=$(curl -sS -o indexnow-response.txt -w '%{http_code}' --max-time 30 \
            -H 'Content-Type: application/json; charset=utf-8' \
            -X POST https://api.indexnow.org/indexnow --data "$payload" || true)
          echo "IndexNow answered HTTP ${status:-000} for $(printf '%s\n' "$urls" | grep -c .) URLs"
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            # The body comes from the remote server. jq -R prints it as one
            # JSON string, so none of its lines can start a workflow command.
            jq -Rs . indexnow-response.txt 2>/dev/null || true
            echo "::warning::IndexNow ping returned HTTP ${status:-000}."
          fi

  # Post-deploy full Chromium suite (boot smoke + playthrough) against kpopquiz.online.
  # Fails the workflow on red; no automatic rollback. Skipped when Cloudflare deploy was skipped (no secrets).
  smoke-prod:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.deploy.outputs.deployed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright boot and playthrough against production
        env:
          CI: true
          CODE_FEEDBACK_ENV: ${{ (vars.PUBLIC_GA4_ID || secrets.PUBLIC_GA4_ID) != '' && 'banner' || 'root' }}
          CODE_FEEDBACK_CF_BEACON: ${{ (vars.PUBLIC_CF_BEACON_TOKEN || secrets.PUBLIC_CF_BEACON_TOKEN) != '' }}
        run: npm run test:e2e:prod
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-prod
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
