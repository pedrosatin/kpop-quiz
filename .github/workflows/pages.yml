name: Build and deploy web app to Cloudflare Pages

on:
  pull_request:
    paths:
      - "web/**"
      - "kpop_scraping/**"
      - "tests/**"
      - "schemas/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  push:
    branches: [master]
    paths:
      - "web/**"
      - "kpop_scraping/**"
      - "tests/**"
      - "schemas/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate and publish daily K-pop puzzles"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Python verification
        working-directory: .
        run: |
          python -m unittest discover -v
          python -m compileall -q .
      - name: Verify published quiz artifacts
        working-directory: .
        run: python -m kpop_scraping.web_publish --output-dir web/public/data --verify --require-grid --require-connections --require-name-guess --require-word-search --require-timeline
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Check Cloudflare credentials
        env:
          HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CLOUDFLARE_CREDENTIALS" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. Skipping deploy to Cloudflare Pages. Add both repository secrets to enable deploys."
          fi
      - name: Deploy to Cloudflare Pages
        env:
          HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        if: env.HAS_CLOUDFLARE_CREDENTIALS == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=kpopquiz --branch=master
